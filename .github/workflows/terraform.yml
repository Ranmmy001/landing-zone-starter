name: terraform checks

on:
  push:
    branches:
      - master

jobs:
  validate:
    name: Format & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 

      - uses: hashicorp/setup-terraform@v3

      - name: terraform fmt (check only)
        run: terraform fmt -check -recursive

      - name: terraform validate
        run: |
          terraform init -backend=false
          terraform validate

  tfsec:
    name: tfsec Security Scan
    runs-on: ubuntu-latest
    needs: validate # Ensures tfsec runs ONLY after validate succeeds
    steps:
      - uses: actions/checkout@v4

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          soft_fail: true # Logs security findings without failing the job


  infracost:
    name: Infracost Estimate
    runs-on: ubuntu-latest
    needs: tfsec
    steps:
      - uses: actions/checkout@v4

      - name: Setup Infracost
        # uses: infracost/actions/setup@v3
        uses: infracost/actions/scan@v4
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
          path: .

      - name: Generate cost estimate
        # run: infracost breakdown --config-file infracost.yml --format json --out-file /tmp/infracost.json
        run: infracost breakdown --path .


      # - name: Post cost estimate as PR comment
      #   uses: infracost/actions/comment@v3
      #   with:
      #     path: /tmp/infracost.json
      #     behavior: update
